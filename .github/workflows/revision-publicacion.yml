name: revision-publicacion
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Revisar exposición de información
        run: python tools/verificar_publicacion.py
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Ejecutar simulación sin conexiones
        run: python demo/simulacion.py
